  <script>
  (function(){
    var ID = 113778417;
    var REF = "ref=NF-6A1130-028B&referral_offer=auto";
    var S = "https://studio.vitrio.space";

    var currentPeriod = 'week';
    document.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('[data-pricing-period]');
      if(b) currentPeriod = b.getAttribute('data-pricing-period') || 'week';
    }, true);
    /* --- отправка цели в Метрику --- */
    function track(goal){
      goal = goal || 'click_cta';
      try{
        if(window.ym){ window.ym(ID,'reachGoal',goal); return; }
      }catch(e){}
      try{
        var c = window.Ya && Ya._metrika && Ya._metrika.counters && Ya._metrika.counters[ID];
        if(c && c.reachGoal) c.reachGoal(goal);
      }catch(e){}
    }
    /* --- переход ТОЛЬКО после того, как сигнал ушёл --- */
    var GO_DELAY = 350;
    function navigate(url, goal){
      track(goal);
      try{ window.ym && window.ym(ID,'params',{}); }catch(e){}
      setTimeout(function(){ location.href = url; }, GO_DELAY);
    }

    /* Перехват ДО того как vitrio.js начнёт свои переходы: слушаем на window, capture */
    function handler(e){
      var el = e.target && e.target.closest && e.target.closest('[data-billing],button,a[href]');
      if(!el) return;

      var plan = el.getAttribute('data-billing');
      if(plan){
        var per = el.getAttribute('data-billing-period');
        if(!per || per==='') per = (plan==='medium') ? 'week' : currentPeriod;
        e.preventDefault(); e.stopPropagation();
        navigate(S+'/register?plan='+plan+'&period='+per+'&'+REF, 'click_cta');
        return;
      }

      var txt = (el.innerText||'').toLowerCase().replace(/\s+/g,' ').trim();
      if(txt.indexOf('войти')===0){
        e.preventDefault(); e.stopPropagation();
        navigate(S+'/login?'+REF, 'click_cta');
        return;
      }
      if(txt.indexOf('попробовать')>=0 || txt.indexOf('открыть студию')>=0 || txt.indexOf('начните за 1')>=0){
        e.preventDefault(); e.stopPropagation();
        navigate(S+'/register?'+REF, 'click_cta');
        return;
      }
    }
    window.addEventListener('click', handler, true);
  })();
  </script>
